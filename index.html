<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Shobha Gupta builds AI agents that do the boring work. Junior AI Engineer, researcher, and Formula 1 fan."
    />
    <title>Shobha Gupta</title>
    <script>
      // Pick the saved look before the page paints, so it never flashes.
      // Keep this list in sync with `themes` in src/data.js.
      try {
        var saved = localStorage.getItem('theme')
        document.documentElement.dataset.theme =
          ['manga', 'pit', 'graph'].indexOf(saved) > -1 ? saved : 'manga'
      } catch (e) {
        document.documentElement.dataset.theme = 'manga'
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Source+Sans+3:wght@400;600&family=Titillium+Web:wght@400;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
